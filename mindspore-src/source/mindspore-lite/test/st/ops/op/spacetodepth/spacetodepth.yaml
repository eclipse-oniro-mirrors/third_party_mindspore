op_name: SpaceToDepth
genonnx:
  - model_name: spacetodepth_fp32_dyn.onnx
    node_param:
      inputs: ["X"]
      outputs: ["Y"]
      attributes:
        blocksize: 2
    graph_param:
      inputs:
        - name: X
          data_type: 1
          dims: [None, None, None, None]
      outputs:
        - name: Y
          data_type: 1
          dims: [None, None, None, None]
      initializer: None
  - model_name: spacetodepth_fp32_fix_input_4d.onnx
    node_param:
      inputs: ["X"]
      outputs: ["Y"]
      attributes:
        blocksize: 2
    graph_param:
      inputs:
        - name: X
          data_type: 1
          dims: [1, 3, 2, 2]
      outputs:
        - name: Y
          data_type: 1
          dims: [1, 12, 1, 1]
      initializer: None

gengold:
  - gold_name: spacetodepth_fp32_dyn_gold_1
    in_model: spacetodepth_fp32_dyn.onnx
    input_dtypes: [1]
    input_shapes: [[8, 8, 8, 8]]
  - gold_name: spacetodepth_fp32_fix_input_4d
    in_model: spacetodepth_fp32_fix_input_4d.onnx
    input_dtypes: [1]
    input_shapes: [[1, 3, 2, 2]]

convert:
  - out_model: spacetodepth_fp32_dyn_2_dyn.ms
    in_model: spacetodepth_fp32_dyn.onnx
    input_shapes: None
  - out_model: spacetodepth_fp32_fix_input_4d.ms
    in_model: spacetodepth_fp32_fix_input_4d.onnx
    input_shapes: None
    fp16: on

run:
  - in_model: spacetodepth_fp32_dyn_2_dyn.ms
    gold_in: spacetodepth_fp32_dyn_gold_1
    dtypes: 1
  - in_model: spacetodepth_fp32_fix_input_4d.ms
    gold_in: spacetodepth_fp32_fix_input_4d
    dtypes: 1

