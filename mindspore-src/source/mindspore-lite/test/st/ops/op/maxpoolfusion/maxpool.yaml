op_name: MaxPool
genonnx:
  - model_name: maxpool_fp32_dyn.onnx
    node_param:
      inputs: ["X"]
      outputs: ["Y"]
      attributes:
        kernel_shape: [3,3]
        strides: [2,2]
    graph_param:
      inputs:
        - name: X
          data_type: 1
          dims: [None, None, None, None]
      outputs:
        - name: Y
          data_type: 1
          dims: [None, None, None, None]
      initializer: None
  - model_name: maxpool_fp32_fix_input_4d.onnx
    node_param:
      inputs: ["X"]
      outputs: ["Y"]
      attributes:
        kernel_shape: [3,3]
        strides: [2,2]

    graph_param:
      inputs:
        - name: X
          data_type: 1
          dims: [1, 3, 224, 224]
      outputs:
        - name: Y
          data_type: 1
          dims: [1, 3, 111, 111]
      initializer: None

gengold:
  - gold_name: maxpool_fp32_dyn_gold_1
    in_model: maxpool_fp32_dyn.onnx
    input_dtypes: [1]
    input_shapes: [[1, 6, 128, 128]]
  - gold_name: maxpool_fp32_fix_input_4d
    in_model: maxpool_fp32_fix_input_4d.onnx
    input_dtypes: [1]
    input_shapes: [[1, 3, 224, 224]]

convert:
  - out_model: maxpool_fp32_dyn_2_dyn.ms
    in_model: maxpool_fp32_dyn.onnx
    input_shapes: None
  - out_model: maxpool_fp32_dyn_2_fix.ms
    in_model: maxpool_fp32_dyn.onnx
    input_shapes: X:1, 6, 128, 128
  - out_model: maxpool_fp32_fix_input_4d.ms
    in_model: maxpool_fp32_fix_input_4d.onnx
    input_shapes: None
    fp16: on

run:
  - in_model: maxpool_fp32_dyn_2_dyn.ms
    gold_in: maxpool_fp32_dyn_gold_1
    dtypes: 1
  - in_model: maxpool_fp32_dyn_2_fix.ms
    gold_in: maxpool_fp32_dyn_gold_1
    dtypes: 1
  - in_model: maxpool_fp32_fix_input_4d.ms
    gold_in: maxpool_fp32_fix_input_4d
    dtypes: 1

