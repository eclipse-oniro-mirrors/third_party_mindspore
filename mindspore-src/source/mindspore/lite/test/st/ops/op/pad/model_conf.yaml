op_name: Pad
genonnx:
  - model_name: pad_fp32_dyn.onnx
    node_param:
      inputs: ['X','pads', 'constant_value']
      outputs: ['Y']
      attributes:
        mode: constant
    graph_param:
      inputs:
        - name: X
          data_type: 1
          dims: [None,None]
      outputs:
        - name: Y
          data_type: 1
          dims: [None,None]
      initializer:
        - name: pads
          data_type: 7
          dims: [4]
          value: [0,2,0,0]
        - name: constant_value
          data_type: 1
          dims: [1]
          value: [0.0]
  - model_name: pad_fp32_fix.onnx
    node_param:
      inputs: ['X','pads', 'constant_value']
      outputs: ['Y']
      attributes:
        mode: constant
    graph_param:
      inputs:
        - name: X
          data_type: 1
          dims: [3,2]
      outputs:
        - name: Y
          data_type: 1
          dims: [3,4]
      initializer:
        - name: pads
          data_type: 7
          dims: [4]
          value: [0,2,0,0]
        - name: constant_value
          data_type: 1
          dims: [1]
          value: [0.0]
  - model_name: pad_fp32_fix_input_3d.onnx
    node_param:
      inputs: ['X','pads', 'constant_value']
      outputs: ['Y']
      attributes:
        mode: constant
    graph_param:
      inputs:
        - name: X
          data_type: 1
          dims: [3,2,4]
      outputs:
        - name: Y
          data_type: 1
          dims: [3,4,4]
      initializer:
        - name: pads
          data_type: 7
          dims: [6]
          value: [0,0,2,0,0,0]
        - name: constant_value
          data_type: 1
          dims: [1]
          value: [0.0]
  - model_name: pad_fp32_fix_input_4d.onnx
    node_param:
      inputs: ['X','pads', 'constant_value']
      outputs: ['Y']
      attributes:
        mode: constant
    graph_param:
      inputs:
        - name: X
          data_type: 1
          dims: [3,2,4,4]
      outputs:
        - name: Y
          data_type: 1
          dims: [3,4,4,4]
      initializer:
        - name: pads
          data_type: 7
          dims: [8]
          value: [0,0,1,1,0,0,0,0]
        - name: constant_value
          data_type: 1
          dims: [1]
          value: [0.0]

gengold:
  - gold_name: pad_fp32_dyn_gold_1
    in_model: pad_fp32_dyn.onnx
    input_dtypes: [1]
    input_shapes: [[128,128]]
  - gold_name: pad_fp32_fix_gold_1
    in_model: pad_fp32_fix.onnx
    input_dtypes: [1]
    input_shapes: [[3,2]]
  - gold_name: pad_fp32_fix_input_3d
    in_model: pad_fp32_fix_input_3d.onnx
    input_dtypes: [1]
    input_shapes: [[3,2,4]]
  - gold_name: pad_fp32_fix_input_4d
    in_model: pad_fp32_fix_input_4d.onnx
    input_dtypes: [1]
    input_shapes: [[3,2,4,4]]

convert:
  - out_model: pad_fp32_dyn_2_dyn.ms
    in_model: pad_fp32_dyn.onnx
    input_shapes: None
    fp16: off
  - out_model: pad_fp32_dyn_2_fix.ms
    in_model: pad_fp32_dyn.onnx
    input_shapes: X:128,128
    fp16: off
  - out_model: pad_fp32_fix_2_fix.ms
    in_model: pad_fp32_fix.onnx
    input_shapes: None
    fp16: off
  - out_model: pad_fp16_dyn_2_dyn.ms
    in_model: pad_fp32_dyn.onnx
    input_shapes: None
    fp16: on
  - out_model: pad_fp16_dyn_2_fix.ms
    in_model: pad_fp32_dyn.onnx
    input_shapes: X:128,128
    fp16: on
  - out_model: pad_fp16_fix_2_fix.ms
    in_model: pad_fp32_fix.onnx
    input_shapes: None
    fp16: on
  - out_model: pad_fp32_fix_input_3d.ms
    in_model: pad_fp32_fix_input_3d.onnx
    input_shapes: None
    fp16: on
  - out_model: pad_fp32_fix_input_4d.ms
    in_model: pad_fp32_fix_input_4d.onnx
    input_shapes: None
    fp16: on

run:
  - in_model: pad_fp32_dyn_2_dyn.ms
    gold_in: pad_fp32_dyn_gold_1
    dtypes: 1
    input_shapes: X:128,128
  - in_model: pad_fp32_dyn_2_fix.ms
    gold_in: pad_fp32_dyn_gold_1
    dtypes: 1
    input_shapes: None
  - in_model: pad_fp32_fix_2_fix.ms
    gold_in: pad_fp32_fix_gold_1
    dtypes: 1
    input_shapes: None
  - in_model: pad_fp16_dyn_2_dyn.ms
    gold_in: pad_fp32_dyn_gold_1
    dtypes: 1
    input_shapes: X:128,128
  - in_model: pad_fp16_dyn_2_fix.ms
    gold_in: pad_fp32_dyn_gold_1
    dtypes: 1
    input_shapes: None
  - in_model: pad_fp16_fix_2_fix.ms
    gold_in: pad_fp32_fix_gold_1
    dtypes: 1
    input_shapes: None
  - in_model: pad_fp32_fix_input_3d.ms
    gold_in: pad_fp32_fix_input_3d
    dtypes: 1
    input_shapes: None
  - in_model: pad_fp32_fix_input_4d.ms
    gold_in: pad_fp32_fix_input_4d
    dtypes: 1
    input_shapes: None