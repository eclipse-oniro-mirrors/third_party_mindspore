op_name: Cos
genonnx:
  - model_name: cos_fp32_dyn.onnx
    node_param:
      inputs: ["X"]
      outputs: ["Z"]
      attributes: None
    graph_param:
      inputs:
        - name: X
          data_type: 1
          dims: [None, None]
      outputs:
        - name: Z
          data_type: 1
          dims: [None, None]
      initializer: None
  - model_name: cos_fp32_fix.onnx
    node_param:
      inputs: ["X"]
      outputs: ["Z"]
      attributes: None
    graph_param:
      inputs:
        - name: X
          data_type: 1
          dims: [256, 256]
      outputs:
        - name: Z
          data_type: 1
          dims: [256, 256]
      initializer: None
  - model_name: cos_fp32_fix_input_3d.onnx
    node_param:
      inputs: ["X"]
      outputs: ["Z"]
      attributes: None
    graph_param:
      inputs:
        - name: X
          data_type: 1
          dims: [256, 256, 2]
      outputs:
        - name: Z
          data_type: 1
          dims: [256, 256, 2]
      initializer: None
  - model_name: cos_fp32_fix_input_4d.onnx
    node_param:
      inputs: ["X"]
      outputs: ["Z"]
      attributes: None
    graph_param:
      inputs:
        - name: X
          data_type: 1
          dims: [256, 256, 2, 2]
      outputs:
        - name: Z
          data_type: 1
          dims: [256, 256, 2, 2]
      initializer: None

gengold:
  - gold_name: cos_fp32_dyn_gold_1
    in_model: cos_fp32_dyn.onnx
    input_dtypes: [1]
    input_shapes: [[128, 128]]
  - gold_name: cos_fp32_fix_gold_1
    in_model: cos_fp32_fix.onnx
    input_dtypes: [1]
    input_shapes: [[256, 256]]
  - gold_name: cos_fp32_fix_input_3d
    in_model: cos_fp32_fix_input_3d.onnx
    input_dtypes: [1]
    input_shapes: [[256, 256, 2]]
  - gold_name: cos_fp32_fix_input_4d
    in_model: cos_fp32_fix_input_4d.onnx
    input_dtypes: [1]
    input_shapes: [[256, 256, 2, 2]]

convert:
  - out_model: cos_fp32_dyn_2_dyn.ms
    in_model: cos_fp32_dyn.onnx
    input_shapes: None
  - out_model: cos_fp32_dyn_2_fix.ms
    in_model: cos_fp32_dyn.onnx
    input_shapes: X:128,128
  - out_model: cos_fp32_fix_2_fix.ms
    in_model: cos_fp32_fix.onnx
    input_shapes: None
  - out_model: cos_fp32_fix_input_3d.ms
    in_model: cos_fp32_fix_input_3d.onnx
    input_shapes: None
  - out_model: cos_fp32_fix_input_4d.ms
    in_model: cos_fp32_fix_input_4d.onnx
    input_shapes: None

run:
  - in_model: cos_fp32_dyn_2_dyn.ms
    gold_in: cos_fp32_dyn_gold_1
    dtypes: 1
    input_shapes: X:128,128
  - in_model: cos_fp32_dyn_2_fix.ms
    gold_in: cos_fp32_dyn_gold_1
    dtypes: 1
    input_shapes: None
  - in_model: cos_fp32_fix_2_fix.ms
    gold_in: cos_fp32_fix_gold_1
    dtypes: 1
    input_shapes: None
  - in_model: cos_fp32_fix_input_3d.ms
    gold_in: cos_fp32_fix_input_3d
    dtypes: 1
    input_shapes: None
  - in_model: cos_fp32_fix_input_4d.ms
    gold_in: cos_fp32_fix_input_4d
    dtypes: 1
    input_shapes: None