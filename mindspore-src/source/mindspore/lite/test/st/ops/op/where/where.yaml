op_name: Where
genonnx:
  - model_name: where_fp32_dyn.onnx
    node_param:
      inputs: ["condition","X","Y"]
      outputs: ["Z"]
      attributes: None
    graph_param:
      inputs:
        - name: condition
          data_type: 9
          dims: [None, None]
        - name: X
          data_type: 1
          dims: [None, None]
        - name: Y
          data_type: 1
          dims: [None, None]
      outputs:
        - name: Z
          data_type: 1
          dims: [None, None]
      initializer: None
  - model_name: where_fp32_fix.onnx
    node_param:
      inputs: ["condition","X","Y"]
      outputs: ["Z"]
      attributes: None
    graph_param:
      inputs:
        - name: condition
          data_type: 9
          dims: [2, 2]
        - name: X
          data_type: 1
          dims: [2, 2]
        - name: Y
          data_type: 1
          dims: [2, 2]
      outputs:
        - name: Z
          data_type: 1
          dims: [2,2]
      initializer: None
  - model_name: where_fp32_fix_input_3d.onnx
    node_param:
      inputs: ["condition","X","Y"]
      outputs: ["Z"]
      attributes: None
    graph_param:
      inputs:
        - name: condition
          data_type: 9
          dims: [2, 3, 3]
        - name: X
          data_type: 1
          dims: [2, 3, 3]
        - name: Y
          data_type: 1
          dims: [2, 3, 3]
      outputs:
        - name: Z
          data_type: 1
          dims: [2, 3, 3]
      initializer: None
  - model_name: where_fp32_fix_input_4d.onnx
    node_param:
      inputs: ["condition","X","Y"]
      outputs: ["Z"]
      attributes: None
    graph_param:
      inputs:
        - name: condition
          data_type: 9
          dims: [2, 3, 8, 1]
        - name: X
          data_type: 1
          dims: [2, 3, 8 ,1]
        - name: Y
          data_type: 1
          dims: [2, 3, 8, 1]
      outputs:
        - name: Z
          data_type: 1
          dims: [2, 3, 8 ,1]
      initializer: None

gengold:
  - gold_name: where_fp32_dyn_gold_1
    in_model: where_fp32_dyn.onnx
    input_dtypes: [9, 1, 1]
    input_shapes: [[2, 2],[2, 2],[2, 2]]
  - gold_name: where_fp32_fix_gold_1
    in_model: where_fp32_fix.onnx
    input_dtypes: [9, 1, 1]
    input_shapes: [[2, 2],[2, 2],[2, 2]]
  - gold_name: where_fp32_fix_input_3d
    in_model: where_fp32_fix_input_3d.onnx
    input_dtypes: [9, 1, 1]
    input_shapes: [[2, 3, 3],[2, 3, 3],[2, 3, 3]]
  - gold_name: where_fp32_fix_input_4d
    in_model: where_fp32_fix_input_4d.onnx
    input_dtypes: [9, 1, 1]
    input_shapes: [[2, 3, 8, 1],[2, 3, 8, 1],[2, 3, 8, 1]]

convert:
  - out_model: where_fp32_dyn_2_dyn.ms
    in_model: where_fp32_dyn.onnx
    input_shapes: None
  - out_model: where_fp32_dyn_2_fix.ms
    in_model: where_fp32_dyn.onnx
    input_shapes: X:128,128
  - out_model: where_fp32_fix_2_fix.ms
    in_model: where_fp32_fix.onnx
    input_shapes: None
  - out_model: where_fp32_fix_input_3d.ms
    in_model: where_fp32_fix_input_3d.onnx
    input_shapes: None
    fp16: on
  - out_model: where_fp32_fix_input_4d.ms
    in_model: where_fp32_fix_input_4d.onnx
    input_shapes: None
    fp16: on

run:
  - in_model: where_fp32_dyn_2_dyn.ms
    gold_in: where_fp32_dyn_gold_1
    dtypes: 1
  - in_model: where_fp32_dyn_2_fix.ms
    gold_in: where_fp32_dyn_gold_1
    dtypes: 1
  - in_model: where_fp32_fix_2_fix.ms
    gold_in: where_fp32_fix_gold_1
    dtypes: 1
  - in_model: where_fp32_fix_input_3d.ms
    gold_in: where_fp32_fix_input_3d
    dtypes: 1
  - in_model: where_fp32_fix_input_4d.ms
    gold_in: where_fp32_fix_input_4d
    dtypes: 1



