op_name: Cast
genonnx:
  - model_name: cast_fp32_dyn.onnx
    node_param:
      inputs: ["input"]
      outputs: ["output"]
      attributes:
        to: 7
    graph_param:
      inputs:
        - name: input
          data_type: 1
          dims: [None, None]
      outputs:
        - name: output
          data_type: 7
          dims: [None]
      initializer: None
  - model_name: cast_fp32_fix.onnx
    node_param:
      inputs: ["input"]
      outputs: ["output"]
      attributes:
        to: 1
    graph_param:
      inputs:
        - name: input
          data_type: 7
          dims: [2, 3]
      outputs:
        - name: output
          data_type: 1
          dims: [2, 3]
      initializer: None
  - model_name: cast_fp32_fix_input_3d.onnx
    node_param:
      inputs: ["input"]
      outputs: ["output"]
      attributes:
        to: 1
    graph_param:
      inputs:
        - name: input
          data_type: 7
          dims: [2, 3, 4]
      outputs:
        - name: output
          data_type: 1
          dims: [2, 3, 4]
      initializer: None
  - model_name: cast_fp32_fix_input_4d.onnx
    node_param:
      inputs: ["input"]
      outputs: ["output"]
      attributes:
        to: 1
    graph_param:
      inputs:
        - name: input
          data_type: 7
          dims: [2, 3, 4, 5]
      outputs:
        - name: output
          data_type: 1
          dims: [2, 3, 4, 5]
      initializer: None

gengold:
  - gold_name: cast_fp32_dyn_gold_1
    in_model: cast_fp32_dyn.onnx
    input_dtypes: [1]
    input_shapes: [[5, 5]]
  - gold_name: cast_fp32_fix_gold_1
    in_model: cast_fp32_fix.onnx
    input_dtypes: [7]
    input_shapes: [[2, 3]]
  - gold_name: cast_fp32_fix_input_3d
    in_model: cast_fp32_fix_input_3d.onnx
    input_dtypes: [7]
    input_shapes: [[2, 3, 4]]
  - gold_name: cast_fp32_fix_input_4d
    in_model: cast_fp32_fix_input_4d.onnx
    input_dtypes: [7]
    input_shapes: [[2, 3, 4, 5]]

convert:
  - out_model: cast_fp32_dyn_2_dyn.ms
    in_model: cast_fp32_dyn.onnx
    input_shapes: None
  - out_model: cast_fp32_dyn_2_fix.ms
    in_model: cast_fp32_dyn.onnx
    input_shapes: input:5,5
  - out_model: cast_fp32_fix_2_fix.ms
    in_model: cast_fp32_fix.onnx
    input_shapes: None
  - out_model: cast_fp16_dyn_2_dyn.ms
    in_model: cast_fp32_dyn.onnx
    input_shapes: None
    fp16: on
  - out_model: cast_fp32_fix_input_3d.ms
    in_model: cast_fp32_fix_input_3d.onnx
    input_shapes: None
    fp16: on
  - out_model: cast_fp32_fix_input_4d.ms
    in_model: cast_fp32_fix_input_4d.onnx
    input_shapes: None
    fp16: on

run:
  - in_model: cast_fp32_dyn_2_dyn.ms
    gold_in: cast_fp32_dyn_gold_1
    dtypes: 1
  - in_model: cast_fp32_dyn_2_fix.ms
    gold_in: cast_fp32_dyn_gold_1
    dtypes: 1
  - in_model: cast_fp32_fix_2_fix.ms
    gold_in: cast_fp32_fix_gold_1
    dtypes: 1
  - in_model: cast_fp16_dyn_2_dyn.ms
    gold_in: cast_fp32_dyn_gold_1
    dtypes: 1
  - in_model: cast_fp32_fix_input_3d.ms
    gold_in: cast_fp32_fix_input_3d
    dtypes: 1
  - in_model: cast_fp32_fix_input_4d.ms
    gold_in: cast_fp32_fix_input_4d
    dtypes: 1