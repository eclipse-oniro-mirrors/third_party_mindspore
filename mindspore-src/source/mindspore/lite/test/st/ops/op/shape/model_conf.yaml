op_name: Shape
genonnx:
  - model_name: shape_fp32_dyn.onnx
    node_param:
      inputs: ["data"]
      outputs: ["shape"]
      attributes: None
    graph_param:
      inputs:
        - name: data
          data_type: 1
          dims: [None, None, None, None]
      outputs:
        - name: shape
          data_type: 7
          dims: [None]
      initializer: None
  - model_name: shape_fp32_fix_input_3d.onnx
    node_param:
      inputs: ["data"]
      outputs: ["shape"]
      attributes:
        start: 0
        end: 3
    graph_param:
      inputs:
        - name: data
          data_type: 1
          dims: [32, 1, 9]
      outputs:
        - name: shape
          data_type: 7
          dims: [3]
      initializer: None

gengold:
  - gold_name: shape_fp32_dyn_gold_1
    in_model: shape_fp32_dyn.onnx
    input_dtypes: [1]
    input_shapes: [[2, 3, 4, 5]]
  - gold_name: shape_fp32_fix_input_3d
    in_model: shape_fp32_fix_input_3d.onnx
    input_dtypes: [1]
    input_shapes: [[32, 1, 9]]

convert:
  - out_model: shape_fp32_dyn_2_dyn.ms
    in_model: shape_fp32_dyn.onnx
    input_shapes: None
  - out_model: shape_fp32_fix_input_3d
    in_model: shape_fp32_fix_input_3d.onnx
    input_shapes: None
    fp16: on

run:
  - in_model: shape_fp32_dyn_2_dyn.ms
    gold_in: shape_fp32_dyn_gold_1
    dtypes: 1
  - in_model: shape_fp32_fix_input_3d.ms
    gold_in: shape_fp32_fix_input_3d
    dtypes: 1

