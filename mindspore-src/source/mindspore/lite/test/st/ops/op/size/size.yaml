op_name: Size
genonnx:
  - model_name: size_fp32_dyn.onnx
    node_param:
      inputs: ["data"]
      outputs: ["size"]
      attributes: None
    graph_param:
      inputs:
        - name: data
          data_type: 1
          dims: [None, None, None, None]
      outputs:
        - name: size
          data_type: 7
          dims: []
      initializer: None
  - model_name: size_fp32_fix_input_3d.onnx
    node_param:
      inputs: ["data"]
      outputs: ["size"]
      attributes: None
    graph_param:
      inputs:
        - name: data
          data_type: 1
          dims: [32, 1, 9]
      outputs:
        - name: size
          data_type: 7
          dims: []
      initializer: None

gengold:
  - gold_name: size_fp32_dyn_gold_1
    in_model: size_fp32_dyn.onnx
    input_dtypes: [1]
    input_shapes: [[2, 3, 4, 5]]
  - gold_name: size_fp32_fix_input_3d
    in_model: size_fp32_fix_input_3d.onnx
    input_dtypes: [1]
    input_shapes: [[32, 1, 9]]

convert:
  - out_model: size_fp32_dyn_2_dyn.ms
    in_model: size_fp32_dyn.onnx
    input_shapes: None
  - out_model: size_fp32_fix_input_3d
    in_model: size_fp32_fix_input_3d.onnx
    input_shapes: None
    fp16: on

run:
  - in_model: size_fp32_dyn_2_dyn.ms
    gold_in: size_fp32_dyn_gold_1
    dtypes: 1
  - in_model: size_fp32_fix_input_3d.ms
    gold_in: size_fp32_fix_input_3d
    dtypes: 1


