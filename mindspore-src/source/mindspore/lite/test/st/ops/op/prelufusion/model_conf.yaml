op_name: PRelu
genonnx:
  - model_name: prelu_fp32_dyn.onnx
    node_param:
      inputs: ["X", "slope"]
      outputs: ["Y"]
      attributes: None
    graph_param:
      inputs:
        - name: X
          data_type: 1
          dims: [None, None]
      outputs:
        - name: Y
          data_type: 1
          dims: [None, None]
      initializer:
        - name: slope
          data_type: 1
          dims: [1]
          value: [0.02]
  - model_name: prelu_fp32_fix.onnx
    node_param:
      inputs: ["X", "slope"]
      outputs: ["Y"]
      attributes: None
    graph_param:
      inputs:
        - name: X
          data_type: 1
          dims: [256, 256]
      outputs:
        - name: Y
          data_type: 1
          dims: [256, 256]
      initializer:
        - name: slope
          data_type: 1
          dims: [1]
          value: [0.02]
  - model_name: prelu_fp32_fix_input_3d.onnx
    node_param:
      inputs: ["X", "slope"]
      outputs: ["Y"]
      attributes: None
    graph_param:
      inputs:
        - name: X
          data_type: 1
          dims: [2, 256, 256]
      outputs:
        - name: Y
          data_type: 1
          dims: [2, 256, 256]
      initializer:
        - name: slope
          data_type: 1
          dims: [1]
          value: [0.02]
  - model_name: prelu_fp32_fix_input_4d.onnx
    node_param:
      inputs: ["X", "slope"]
      outputs: ["Y"]
      attributes: None
    graph_param:
      inputs:
        - name: X
          data_type: 1
          dims: [2, 2, 256, 256]
      outputs:
        - name: Y
          data_type: 1
          dims: [2, 2, 256, 256]
      initializer:
        - name: slope
          data_type: 1
          dims: [1]
          value: [0.02]

gengold:
  - gold_name: prelu_fp32_dyn_gold_1
    in_model: prelu_fp32_dyn.onnx
    input_dtypes: [1]
    input_shapes: [[128, 128]]
  - gold_name: prelu_fp32_fix_gold_1
    in_model: prelu_fp32_fix.onnx
    input_dtypes: [1]
    input_shapes: [[256, 256]]
  - gold_name: prelu_fp32_fix_input_3d
    in_model: prelu_fp32_fix_input_3d.onnx
    input_dtypes: [1]
    input_shapes: [[2, 256, 256]]
  - gold_name: prelu_fp32_fix_input_4d
    in_model: prelu_fp32_fix_input_4d.onnx
    input_dtypes: [1]
    input_shapes: [[2, 2, 256, 256]]

convert:
  - out_model: prelu_fp32_dyn_2_dyn.ms
    in_model: prelu_fp32_dyn.onnx
    input_shapes: None
  - out_model: prelu_fp32_dyn_2_fix.ms
    in_model: prelu_fp32_dyn.onnx
    input_shapes: X:128,128
  - out_model: prelu_fp32_fix_2_fix.ms
    in_model: prelu_fp32_fix.onnx
    input_shapes: None
  - out_model: prelu_fp32_fix_input_3d.ms
    in_model: prelu_fp32_fix_input_3d.onnx
    input_shapes: None
  - out_model: prelu_fp32_fix_input_4d.ms
    in_model: prelu_fp32_fix_input_4d.onnx
    input_shapes: None
    
run:
  - in_model: prelu_fp32_dyn_2_dyn.ms
    gold_in: prelu_fp32_dyn_gold_1
    dtypes: 1
    input_shapes: X:128,128
  - in_model: prelu_fp32_dyn_2_fix.ms
    gold_in: prelu_fp32_dyn_gold_1
    dtypes: 1
    input_shapes: None
  - in_model: prelu_fp32_fix_2_fix.ms
    gold_in: prelu_fp32_fix_gold_1
    dtypes: 1
    input_shapes: None
  - in_model: prelu_fp32_fix_input_3d.ms
    gold_in: prelu_fp32_fix_input_3d
    dtypes: 1
    input_shapes: None
  - in_model: prelu_fp32_fix_input_4d.ms
    gold_in: prelu_fp32_fix_input_4d
    dtypes: 1
    input_shapes: None