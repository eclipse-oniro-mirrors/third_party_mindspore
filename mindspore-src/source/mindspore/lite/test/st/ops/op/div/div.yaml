gengold:
  - gold_name: div_fp32_dyn_gold_1
    in_model: div_fp32_dyn.onnx
    input_dtypes: [1, 1]
    input_shapes: [[128, 128], [128, 128]]
  - gold_name: div_fp32_fix_gold_1
    in_model: div_fp32_fix.onnx
    input_dtypes: [1, 1]
    input_shapes: [[256, 256], [256, 256]]
  - gold_name: div_fp32_fix_input_3d
    in_model: div_fp32_fix_input_3d.onnx
    input_dtypes: [1, 1]
    input_shapes: [[256, 256, 2], [256, 256, 2]]
  - gold_name: div_fp32_fix_input_4d
    in_model: div_fp32_fix_input_4d.onnx
    input_dtypes: [1, 1]
    input_shapes: [[256, 256, 2, 2], [256, 256, 2, 2]]

convert:
  - out_model: div_fp32_dyn_2_dyn.ms
    in_model: div_fp32_dyn.onnx
    input_shapes: None
  - out_model: div_fp32_dyn_2_fix.ms
    in_model: div_fp32_dyn.onnx
    input_shapes: X:128,128;Y:128,128
  - out_model: div_fp32_fix_2_fix.ms
    in_model: div_fp32_fix.onnx
    input_shapes: None
    fp16: off
  - out_model: div_fp16_dyn_2_dyn.ms
    in_model: div_fp32_dyn.onnx
    input_shapes: None
    fp16: on
  - out_model: div_fp16_dyn_2_fix.ms
    in_model: div_fp32_dyn.onnx
    input_shapes: X:128,128;Y:128,128
