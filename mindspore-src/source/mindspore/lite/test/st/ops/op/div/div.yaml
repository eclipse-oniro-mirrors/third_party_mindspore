    gold_in: div_fp32_dyn_gold_1
    dtypes: 1
    input_shapes: X:128,128;Y:128,128
  - in_model: div_fp32_dyn_2_fix.ms
    gold_in: div_fp32_dyn_gold_1
    dtypes: 1
    input_shapes: None
  - in_model: div_fp32_fix_2_fix.ms
    gold_in: div_fp32_fix_gold_1
    dtypes: 1
    input_shapes: None
  - in_model: div_fp16_dyn_2_dyn.ms
    gold_in: div_fp32_dyn_gold_1
    dtypes: 1
    input_shapes: X:128,128;Y:128,128
  - in_model: div_fp16_dyn_2_fix.ms
    gold_in: div_fp32_dyn_gold_1
