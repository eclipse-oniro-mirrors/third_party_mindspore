  - model_name: div_fp32_fix_input_3d.onnx
    node_param:
      inputs: ["X", "Y"]
      outputs: ["Z"]
      attributes: None
    graph_param:
      inputs:
        - name: X
          data_type: 1
          dims: [256, 256, 2]
        - name: Y
          data_type: 1
          dims: [256, 256, 2]
      outputs:
        - name: Z
          data_type: 1
          dims: [256, 256, 2]
      initializer: None
  - model_name: div_fp32_fix_input_4d.onnx
    node_param:
