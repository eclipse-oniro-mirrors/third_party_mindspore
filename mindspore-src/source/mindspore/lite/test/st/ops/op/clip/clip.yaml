op_name: Clip
genonnx:
  - model_name: clip_fp32_dyn.onnx
    node_param:
      inputs: ["input", "min", "max"]
      outputs: ["output"]
      attributes: None
    graph_param:
      inputs:
        - name: input
          data_type: 1
          dims: [None, None]
      outputs:
        - name: output
          data_type: 1
          dims: [None, None]
      initializer:
        - name: min
          data_type: 1
          dims: [1]
          value: [0.0]
        - name: max
          data_type: 1
          dims: [1]
          value: [2.0]
  - model_name: clip_fp32_fix.onnx
    node_param:
      inputs: ["input", "min", "max"]
      outputs: ["output"]
      attributes: None
    graph_param:
      inputs:
        - name: input
          data_type: 1
          dims: [2, 3]
      outputs:
        - name: output
          data_type: 1
          dims: [2, 3]
      initializer:
        - name: min
          data_type: 1
          dims: [1]
          value: [0.0]
        - name: max
          data_type: 1
          dims: [1]
          value: [2.0]
  - model_name: clip_fp32_fix_input_3d.onnx
    node_param:
      inputs: ["input", "min", "max"]
      outputs: ["output"]
      attributes: None
    graph_param:
      inputs:
        - name: input
          data_type: 1
          dims: [2, 3, 4]
      outputs:
        - name: output
          data_type: 1
          dims: [2, 3, 4]
      initializer:
        - name: min
          data_type: 1
          dims: [1]
          value: [0.0]
        - name: max
          data_type: 1
          dims: [1]
          value: [2.0]
  - model_name: clip_fp32_fix_input_4d.onnx
    node_param:
      inputs: ["input", "min", "max"]
      outputs: ["output"]
      attributes: None
    graph_param:
      inputs:
        - name: input
          data_type: 1
          dims: [1, 2, 3, 4]
      outputs:
        - name: output
          data_type: 1
          dims: [1, 2, 3, 4]
      initializer:
        - name: min
          data_type: 1
          dims: [1]
          value: [0.0]
        - name: max
          data_type: 1
          dims: [1]
          value: [2.0]

gengold:
  - gold_name: clip_fp32_dyn_gold_1
    in_model: clip_fp32_dyn.onnx
    input_dtypes: [1]
    input_shapes: [[5, 5]]
  - gold_name: clip_fp32_fix_gold_1
    in_model: clip_fp32_fix.onnx
    input_dtypes: [1]
    input_shapes: [[2, 3]]
  - gold_name: clip_fp32_fix_input_3d
    in_model: clip_fp32_fix_input_3d.onnx
    input_dtypes: [1]
    input_shapes: [[2, 3, 4]]
  - gold_name: clip_fp32_fix_input_4d
    in_model: clip_fp32_fix_input_4d.onnx
    input_dtypes: [1]
    input_shapes: [[1, 2, 3, 4]]

convert:
  - out_model: clip_fp32_dyn_2_dyn.ms
    in_model: clip_fp32_dyn.onnx
    input_shapes: None
  - out_model: clip_fp32_dyn_2_fix.ms
    in_model: clip_fp32_dyn.onnx
    input_shapes: input:5,5
  - out_model: clip_fp32_fix_2_fix.ms
    in_model: clip_fp32_fix.onnx
    input_shapes: None
  - out_model: clip_fp16_dyn_2_dyn.ms
    in_model: clip_fp32_dyn.onnx
    input_shapes: None
    fp16: on
  - out_model: clip_fp32_fix_input_3d.ms
    in_model: clip_fp32_fix_input_3d.onnx
    input_shapes: None
    fp16: on
  - out_model: clip_fp32_fix_input_4d.ms
    in_model: clip_fp32_fix_input_4d.onnx
    input_shapes: None
    fp16: on

run:
  - in_model: clip_fp32_dyn_2_dyn.ms
    gold_in: clip_fp32_dyn_gold_1
    dtypes: 1
  - in_model: clip_fp32_dyn_2_fix.ms
    gold_in: clip_fp32_dyn_gold_1
    dtypes: 1
  - in_model: clip_fp32_fix_2_fix.ms
    gold_in: clip_fp32_fix_gold_1
    dtypes: 1
  - in_model: clip_fp16_dyn_2_dyn.ms
    gold_in: clip_fp32_dyn_gold_1
    dtypes: 1
  - in_model: clip_fp32_fix_input_3d.ms
    gold_in: clip_fp32_fix_input_3d
    dtypes: 1   
  - in_model: clip_fp32_fix_input_4d.ms
    gold_in: clip_fp32_fix_input_4d
    dtypes: 1